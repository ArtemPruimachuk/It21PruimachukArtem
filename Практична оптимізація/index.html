<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Каталог товарів</title>
    <link rel="stylesheet" href="after.css">
</head>
<body>
    <header class="header">
        <h1 class="header__title">Каталог товарів</h1>
    </header>
    <main class="products">
        <div class="product-card">
            <h2 class="product-card__title">Ноутбук</h2>
            <p class="product-card__description">Потужний ноутбук для навчання та роботи з графікою.</p>
            <span class="product-card__price">35 000 грн</span>
            <button class="product-card__button">Купити</button>
        </div>
        <div class="product-card product-card--featured">
            <span class="product-card__badge">Хіт продажу</span>
            <h2 class="product-card__title">Смартфон</h2>
            <p class="product-card__description">Сучасний смартфон із чудовою камерою та яскравим екраном.</p>
            <span class="product-card__price">25 000 грн</span>
            <button class="product-card__button product-card__button--accent">Купити</button>
        </div>
        <div class="product-card">
            <h2 class="product-card__title">Планшет</h2>
            <p class="product-card__description">Зручний планшет для читання, перегляду відео та малювання.</p>
            <span class="product-card__price">15 000 грн</span>
            <button class="product-card__button">Купити</button>
        </div>
    </main>
</body>
</html>
